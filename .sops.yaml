creation_rules:
  - path_regex: hosts/nixos-ci/secrets.yaml$
    key_groups:
      - age:
        - *nixos-ci
  - path_regex: hosts/nixos-n8n/secrets.yaml$
    key_groups:
      - age:
        - *nixos-ci
        - *nixos-n8n
  - path_regex: hosts/nixos-n8n-runner/secrets/auth-env.yaml$
    key_groups:
      - age:
        - *nixos-ci
        - *nixos-n8n-runner
  - path_regex: common/secrets/postgresql-shared.yaml$
    key_groups:
      - age:
        - *nixos-ci
        - *nixos-n8n
        - *nixos-postgresql
  - path_regex: hosts/nixos-hindsight/secrets/hindsight-env.env$
    key_groups:
      - age:
        - *nixos-ci
        - *nixos-hindsight
  - path_regex: hosts/nixos-calibre-wa/secrets/calibre-wa.yaml$
    key_groups:
      - age:
        - *nixos-ci
        - *nixos-calibre-wa
