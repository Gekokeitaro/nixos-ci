
name: deploy-llamaswap

on:
  push:
    branches:
      - main
      - llamaswap-rocm
  workflow_dispatch:

concurrency:
  group: deploy-llamaswap
  cancel-in-progress: false

env:
  HOST: 192.168.18.11
  DEPLOY_KEY: /run/credentials/forgejo-runner-ci.service/deploykey

jobs:
  deploy:
    runs-on: host

    steps:
      - uses: actions/checkout@v4

      - name: Comprobar conectividad SSH
        run: |
          if ! timeout 5 bash -c "echo > /dev/tcp/$HOST/22"; then
            echo "::error::SSH no disponible en $HOST. Abortando despliegue."
            exit 1
          fi

      - name: Desplegar
        run: |
          export HOME="$PWD/.ci-home"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          export NIX_SSHOPTS="-i $DEPLOY_KEY \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

          if [ "${{ github.ref_name }}" = "main" ]; then
            action=switch
          else
            action=test
          fi

          nixos-rebuild "$action" --flake ".#nixos-llamaswap-rocm" \
            --target-host "$nixos-llamaswap-rocm@$HOST" --elevate=sudo
