
name: deploy-llamaswap

on:
  push:
    branches:
      - main
      - llamaswap-rocm
  workflow_dispatch:

concurrency:
  group: deploy-llamaswap
  cancel-in-progress: false

env:
  HOST: 192.168.18.11
  DEPLOY_KEY: /run/credentials/forgejo-runner-ci.service/deploykey

jobs:
  deploy:
    runs-on: host

    steps:
      - uses: actions/checkout@v4

      - name: Check over SSH that the LXC is up
        run: |
          if ! timeout 5 bash -c "echo > /dev/tcp/$HOST/22"; then
            echo "::error::SSH not available on $HOST. Aborting deployment."
            exit 1
          fi

      # The llamaBenchRunner pin lagged behind every time the runner's repository
      # gained commits. It is updated here, before building: the new rev ends up in
      # the job log, because this change is not committed.
      - name: Update the llama-bench-runner pin
        run: |
          export HOME="$PWD/.ci-home"
          mkdir -p "$HOME"
          # The runner service pins its PATH in systemd and `nix` only shows up there
          # after this host's next `nixos-rebuild`; the system profile already
          # has it, so it is prepended. Remove this once the host is applied.
          export PATH="/run/current-system/sw/bin:$PATH"
          nix run .#update-llama-bench-runner

      - name: Deploy
        run: |
          export HOME="$PWD/.ci-home"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          export NIX_SSHOPTS="-i $DEPLOY_KEY \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

          if [ "${{ github.ref_name }}" = "main" ]; then
            action=switch
          else
            action=test
          fi

          nixos-rebuild "$action" --flake ".#nixos-llamaswap-rocm" \
            --target-host "nixos-llamaswap-rocm@$HOST" --elevate=sudo
